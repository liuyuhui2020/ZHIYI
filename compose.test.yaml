name: zhiyi-005-postgresql-test

services:
  postgresql:
    image: postgres:18.6@sha256:1ffbf339f5b8e78c394cfaad3711ef6dbc4e14546bf70428e0bb30cba66e8e4d
    restart: "no"
    environment:
      POSTGRES_DB: zhiyi_test
      POSTGRES_USER: zhiyi_test
      POSTGRES_PASSWORD: zhiyi_test_password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiyi_test -d zhiyi_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 10s
    volumes:
      - postgresql-test-data:/var/lib/postgresql

volumes:
  postgresql-test-data:
    name: zhiyi-005-postgresql-test-data
