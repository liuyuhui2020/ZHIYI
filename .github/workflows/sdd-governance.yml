name: SDD Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  design-drift:
    name: Spec Kit and design drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Resolve comparison base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "ref=origin/$PULL_REQUEST_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate SDD and design alignment
        run: >-
          python3 scripts/sdd/check_design_drift.py
          --base-ref "${{ steps.base.outputs.ref }}"
          --gate ci
          --root "${{ github.workspace }}"

      - name: Run governance tests
        run: python3 -m unittest discover -s scripts/sdd/tests -v
