name: Runtime Python Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Frozen Python quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.6

      - name: Sync frozen environment
        run: uv sync --all-groups --frozen --python 3.12

      - name: Run offline tests
        run: uv run pytest -m "not online and not postgresql"

      - name: Run Ruff
        run: |
          uv run ruff check src tests migrations
          uv run ruff format --check src tests migrations

      - name: Run mypy
        run: uv run mypy

      - name: Run governance tests
        run: python3 -m unittest discover -s scripts/sdd/tests -v

      - name: Resolve comparison base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "ref=origin/$PULL_REQUEST_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Check design drift
        run: >-
          python3 scripts/sdd/check_design_drift.py
          --base-ref "${{ steps.base.outputs.ref }}"
          --gate ci
          --root "${{ github.workspace }}"

  postgresql:
    name: PostgreSQL 18.6 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZHIYI_TEST_DATABASE_URL: postgresql+psycopg://zhiyi_test:zhiyi_test_password@127.0.0.1:5432/zhiyi_test

    services:
      postgresql:
        image: postgres:18.6@sha256:1ffbf339f5b8e78c394cfaad3711ef6dbc4e14546bf70428e0bb30cba66e8e4d
        env:
          POSTGRES_DB: zhiyi_test
          POSTGRES_USER: zhiyi_test
          POSTGRES_PASSWORD: zhiyi_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhiyi_test -d zhiyi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.6

      - name: Sync frozen environment
        run: uv sync --all-groups --frozen --python 3.12

      - name: Export disposable service identity
        run: echo "ZHIYI_TEST_POSTGRESQL_CONTAINER=${{ job.services.postgresql.id }}" >> "$GITHUB_ENV"

      - name: Prove PostgreSQL and fast-lane collection partition
        shell: bash
        run: |
          uv run pytest --collect-only -q -m postgresql > /tmp/postgresql-nodes.txt
          test -s /tmp/postgresql-nodes.txt
          grep -q 'test_postgresql_run_repository_contract.py' /tmp/postgresql-nodes.txt
          grep -q 'tests/integration/persistence/' /tmp/postgresql-nodes.txt
          grep -q 'test_postgresql_run_repository.py' /tmp/postgresql-nodes.txt
          set +e
          uv run pytest --collect-only -q -m 'not online and not postgresql' \
            tests/contract/persistence/test_postgresql_run_repository_contract.py \
            tests/integration/persistence \
            tests/performance/test_postgresql_run_repository.py > /tmp/fast-database-nodes.txt
          fast_status=$?
          set -e
          test "$fast_status" -eq 5
          grep -q '^no tests collected' /tmp/fast-database-nodes.txt

      - name: Apply and verify reviewed migrations
        run: |
          uv run alembic upgrade head
          uv run alembic current --check-heads
          uv run alembic check

      - name: Run real PostgreSQL acceptance
        run: uv run pytest -m postgresql

      - name: Check migration source quality
        run: |
          uv run ruff check migrations
          uv run ruff format --check migrations
