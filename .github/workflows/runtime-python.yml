name: Runtime Python Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Frozen Python quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.6

      - name: Sync frozen environment
        run: uv sync --all-groups --frozen --python 3.12

      - name: Run offline tests
        run: uv run pytest -m "not online"

      - name: Run Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Run mypy
        run: uv run mypy

      - name: Run governance tests
        run: python3 -m unittest discover -s scripts/sdd/tests -v

      - name: Resolve comparison base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "ref=origin/$PULL_REQUEST_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Check design drift
        run: >-
          python3 scripts/sdd/check_design_drift.py
          --base-ref "${{ steps.base.outputs.ref }}"
          --gate ci
          --root "${{ github.workspace }}"
